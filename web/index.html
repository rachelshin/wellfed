<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Well Fed" />
    <meta name="theme-color" content="#7050BE" />

    <title>Well Fed</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/apple-touch-icon.png" as="image" />

    <style>
      /* Prevent iOS PWA zoom on input focus; remove browser focus ring */
      input, textarea, select {
        font-size: 16px !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
        -webkit-appearance: none;
      }
      input:focus, textarea:focus, select:focus {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
      }
      /* -webkit-appearance:none strips date-input text rendering on iOS;
         textfield keeps the picker working while letting our border/bg styles apply */
      input[type="date"] {
        -webkit-appearance: textfield;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        /* Match splash gradient end-color so there's no flash before the splash div renders */
        background-color: #7050BE;
        overflow: hidden;
      }

      #root {
        height: 100%;
        overflow: hidden;
      }

      @keyframes splashLogoIn {
        0%   { opacity: 0; transform: scale(0.55) translateY(12px); }
        65%  { transform: scale(1.08) translateY(-3px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes splashFadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashDot {
        0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
        40%            { transform: scale(1);   opacity: 1; }
      }

      #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(160deg, #9B6BC8 0%, #7050BE 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-out;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        animation: splashLogoIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #splash-title {
        opacity: 0;
        animation: splashFadeUp 0.45s ease-out 0.35s forwards;
      }
      #splash-sub {
        opacity: 0;
        animation: splashFadeUp 0.45s ease-out 0.5s forwards;
      }
      #splash-dots {
        display: flex;
        gap: 7px;
        margin-top: 48px;
        opacity: 0;
        animation: splashFadeUp 0.45s ease-out 0.65s forwards;
      }
      #splash-dots span {
        width: 7px;
        height: 7px;
        background: rgba(255,255,255,0.75);
        border-radius: 50%;
        animation: splashDot 1.3s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.18s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.36s; }

      /* Remove tap highlight on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <script>window.__splashStart = Date.now();</script>
    <div id="splash">
      <img id="splash-logo" src="/apple-touch-icon.png" alt="" style="width:96px;height:96px;border-radius:24px;margin-bottom:20px;display:block;" onerror="this.style.display='none'" />
      <div id="splash-title" style="color:#fff;font-size:26px;font-weight:800;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-0.4px;">Well Fed</div>
      <div id="splash-sub" style="color:rgba(255,255,255,0.65);font-size:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin-top:5px;letter-spacing:0.1px;">your kitchen companion</div>
      <div id="splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const worker = reg.installing;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          });
        });
      }
    </script>
  </body>
</html>
