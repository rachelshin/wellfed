<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Well Fed" />
    <meta name="theme-color" content="#9B80A8" />

    <title>Well Fed</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Prevent iOS PWA zoom on input focus; remove browser focus ring */
      input, textarea, select {
        font-size: 16px !important;
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
        -webkit-appearance: none;
      }
      input:focus, textarea:focus, select:focus {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
        -webkit-appearance: none;
      }

      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #F6F7F2;
        overflow: hidden;
      }

      #splash {
        position: fixed;
        inset: 0;
        background-color: #9B80A8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Remove tap highlight on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <script>window.__splashStart = Date.now();</script>
    <div id="splash">
      <img src="/apple-touch-icon.png" alt="" style="width:88px;height:88px;border-radius:22px;margin-bottom:16px;display:block;" />
      <div style="color:#fff;font-size:22px;font-weight:800;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-0.3px;">Well Fed ✨</div>
    </div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const worker = reg.installing;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          });
        });
      }
    </script>
  </body>
</html>
